name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Required Keys & Configs
        run: |
          # 1. Create debug keystore
          mkdir -p ~/.android app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true

          # 2. Generate matching google-services.json
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "omnifiles-dummy",
              "storage_bucket": "omnifiles-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.omnifiles.abxzyz"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildVerification"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 3. Setup Android SDK local properties & env
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle 9.7 Wrapper
        run: |
          gradle wrapper --gradle-version 9.7.0 --distribution-type all
          chmod +x gradlew

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Djava.awt.headless=true' -Dfile.encoding=UTF-8"
        run: ./gradlew assembleDebug --no-daemon -x test -x lint -x lintVitalRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AiTrade-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
