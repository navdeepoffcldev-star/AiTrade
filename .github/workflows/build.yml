name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Android Debug Keystore & Environment
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          mkdir -p app
          cp ~/.android/debug.keystore app/debug.keystore 2>/dev/null || true

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Djava.awt.headless=true'"
        run: ./gradlew assembleDebug --no-daemon -x test -x lint -x lintVitalRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiTrade-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
